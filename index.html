    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #fdfdfc;
            color: #1a1a1a;
            -webkit-tap-highlight-color: transparent;
        }

        .swatch-shadow {
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }

        .combination-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        @media (hover: hover) {
            .combination-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            }
        }

        .sticky-nav {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background-color: rgba(253, 253, 252, 0.85);
        }

        /* Scrollbar styling for desktop */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d1d1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a1a1a1;
        }

        /* Hide scrollbar for horizontal mobile scroll areas */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .search-input:focus {
            outline: none;
            border-color: #a8a29e;
            box-shadow: 0 0 0 2px rgba(168, 162, 158, 0.1);
        }

        .format-btn.active {
            background-color: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            color: #1c1917;
        }
    </style>
</head>

                </div>

        </div>
    </nav>

            "136": { id: "136", jp: "濃金茶", en: "Sudan Brown", rgb: [155, 83, 72] },
            "137": { id: "137", jp: "淡金茶", en: "Vinaceous Cinnamon", rgb: [245, 153, 148] },
            "138": { id: "138", jp: "濃山吹", en: "Apricot Orange", rgb: [255, 115, 64] },
            "139": { id: "139", jp: "淡山吹", en: "Apricot Yellow", rgb: [255, 230, 0] },
            "140": { id: "140", jp: "濃銀鼠", en: "Slate Color", rgb: [27, 54, 68] },
            "141": { id: "141", jp: "濃白緑", en: "Light Porcelain Green", rgb: [35, 193, 124] },
            "142": { id: "142", jp: "淡白緑", en: "Turquoise Green", rgb: [181, 255, 194] },
            "143": { id: "143", jp: "濃路考", en: "Dark Medici Blue", rgb: [65, 119, 119] },
            "144": { id: "144", jp: "淡路考", en: "Pale Raw Umber", rgb: [94, 64, 23] },
            "145": { id: "145", jp: "濃菖蒲", en: "Dusky Madder Violet", rgb: [45, 0, 96] },
            "146": { id: "146", jp: "淡菖蒲", en: "Aconite Violet", rgb: [156, 82, 242] },
            "147": { id: "147", jp: "濃若竹", en: "Benzol Green", rgb: [0, 217, 115] },
            "148": { id: "148", jp: "淡若竹", en: "Sea Green", rgb: [51, 255, 125] },
            "149": { id: "149", jp: "濃浅葱", en: "Antwerp Blue", rgb: [0, 138, 161] },
            "150": { id: "150", jp: "濃花浅葱", en: "Peacock Blue", rgb: [0, 207, 145] },
            "151": { id: "151", jp: "濃納戸", en: "Helvetia Blue", rgb: [0, 87, 186] },
            "152": { id: "152", jp: "淡納戸", en: "Salvia Blue", rgb: [150, 191, 230] },
            "153": { id: "153", jp: "濃空色", en: "Antwerp Blue", rgb: [0, 138, 161] },
            "154": { id: "154", jp: "淡空色", en: "Calamine Blue", rgb: [128, 255, 204] },
            "155": { id: "155", jp: "濃萌木", en: "Oil Green", rgb: [110, 169, 0] },
            "156": { id: "156", jp: "淡萌木", en: "Nile Blue", rgb: [191, 255, 230] },
            "157": { id: "157", jp: "濃常磐", en: "Diamine Green", rgb: [27, 142, 19] },
            "158": { id: "158", jp: "淡常磐", en: "Sea Green", rgb: [51, 255, 125] },
            "159": { id: "159", jp: "濃鉄色", en: "Deep Slate Green", rgb: [15, 38, 31] }
        };

        const COMBINATIONS = [];
        const keys = Object.keys(COLORS);

        for (let i = 1; i <= 348; i++) {
            let type = i <= 120 ? 2 : (i <= 240 ? 3 : 4);
            let colorIds = [];
            if (type === 2) {
                colorIds = [keys[(i-1) % keys.length], keys[(i+4) % keys.length]];
            } else if (type === 3) {
                colorIds = [keys[(i-1) % keys.length], keys[(i+11) % keys.length], keys[(i+23) % keys.length]];
            } else {
                colorIds = [keys[(i-1) % keys.length], keys[(i+7) % keys.length], keys[(i+15) % keys.length], keys[(i+31) % keys.length]];
            }
            COMBINATIONS.push({ id: i.toString().padStart(3, '0'), colors: colorIds, type });
        }

        let currentType = 'all';
        let currentSearch = '';
        let currentFormat = 'hex'; // Default format

        const grid = document.getElementById('combination-grid');
        const emptyState = document.getElementById('empty-state');
        const countSpan = document.getElementById('visible-count');
        const toast = document.getElementById('toast');

        function showToast(text) {
            toast.innerText = text;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        function copyToClipboard(str) {
            const el = document.createElement('textarea');
            el.value = str;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast(`Copied ${str}`);
        }

        // Color Formatting Utilities
        function getFormattedColor(rgb, format) {
            const [r, g, b] = rgb;
            if (format === 'rgb') return `rgb(${r}, ${g}, ${b})`;
            if (format === 'hex') {
                return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase();
            }
            if (format === 'cmyk') {
                let r_ = r / 255;
                let g_ = g / 255;
                let b_ = b / 255;
                let k = 1 - Math.max(r_, g_, b_);
                let c = (1 - r_ - k) / (1 - k) || 0;
                let m = (1 - g_ - k) / (1 - k) || 0;
                let y = (1 - b_ - k) / (1 - k) || 0;
                return `${Math.round(c * 100)}, ${Math.round(m * 100)}, ${Math.round(y * 100)}, ${Math.round(k * 100)}`;
            }
        }

        function setFormat(format) {
            currentFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`fmt-${format}`).classList.add('active');
            render();
        }

        function handleSearch(val) {
            currentSearch = val.toLowerCase().trim();
            render();
        }

        function render() {
            grid.innerHTML = '';
            const filtered = COMBINATIONS.filter(comb => {
                const matchesType = currentType === 'all' || comb.type === currentType;
                const matchesSearch = !currentSearch || 
                    comb.id.includes(currentSearch) || 
                    comb.colors.some(cid => {
                        const c = COLORS[cid];
                        return c.jp.toLowerCase().includes(currentSearch) || 
                               c.en.toLowerCase().includes(currentSearch);
                    });
                return matchesType && matchesSearch;
            });
            countSpan.innerText = filtered.length;
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');
                filtered.forEach(comb => {
                    const card = document.createElement('div');
                    card.className = 'combination-card bg-white border border-stone-200 p-4 md:p-5 rounded-xl flex flex-col group';
                    const palette = document.createElement('div');
                    palette.className = 'flex h-24 md:h-32 rounded-lg overflow-hidden mb-5 md:mb-6 swatch-shadow cursor-pointer';
                    comb.colors.forEach(cid => {
                        const c = COLORS[cid];
                        const swatchValue = getFormattedColor(c.rgb, currentFormat);
                        const swatch = document.createElement('div');
                        swatch.className = 'flex-1 transition-opacity hover:opacity-90 active:opacity-75';
                        swatch.style.backgroundColor = `rgb(${c.rgb.join(',')})`;
                        swatch.onclick = (e) => {
                            e.stopPropagation();
                            copyToClipboard(swatchValue);
                        };
                        palette.appendChild(swatch);
                    });
                    const meta = document.createElement('div');
                    meta.innerHTML = `<div class="flex justify-between items-start mb-3 md:mb-4"><span class="text-[11px] md:text-xs font-bold tracking-widest text-stone-400 uppercase">No. ${comb.id}</span><span class="px-2 py-0.5 bg-stone-100 text-[9px] md:text-[10px] font-bold text-stone-500 rounded uppercase tracking-tighter">${comb.type}-color</span></div>`;
                    const labels = document.createElement('div');
                    labels.className = 'space-y-3 md:space-y-3';
                    comb.colors.forEach(cid => {
                        const c = COLORS[cid];
                        const codeValue = getFormattedColor(c.rgb, currentFormat);
                        const entry = document.createElement('div');
                        entry.className = 'flex items-center gap-3 group/entry cursor-pointer active:scale-95 transition-transform';
                        entry.onclick = () => copyToClipboard(codeValue);
                        entry.innerHTML = `<div class="w-2.5 h-2.5 md:w-3 md:h-3 rounded-full border border-stone-100 shadow-sm shrink-0" style="background-color: rgb(${c.rgb.join(',')})"></div><div class="flex-1 min-w-0"><div class="flex justify-between items-baseline"><span class="text-[11px] md:text-xs font-medium text-stone-800 truncate pr-2">${c.jp}</span><span class="text-[9px] md:text-[10px] text-stone-300 font-mono group-hover/entry:text-stone-500 transition-colors">${codeValue}</span></div><div class="text-[9px] md:text-[10px] text-stone-400 italic font-light truncate">${c.en}</div></div>`;
                        labels.appendChild(entry);
                    });
                    card.appendChild(palette);
                    card.appendChild(meta);
                    card.appendChild(labels);
                    grid.appendChild(card);
                });
            }
        }

        function filterType(type) {
            currentType = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'shadow-sm', 'text-stone-900');
                btn.classList.add('text-stone-500');
            });
            const activeBtn = document.getElementById(`btn-${type}`);
            activeBtn.classList.add('bg-white', 'shadow-sm', 'text-stone-900');
            activeBtn.classList.remove('text-stone-500');
            render();
        }
        window.onload = render;
    </script>
</body>
